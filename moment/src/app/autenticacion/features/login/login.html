<div class="login-container">
  <div class="login-card">
    
    <div class="auth-tabs">
      <button 
        type="button" 
        class="tab-btn" 
        [class.active]="modo() === 'login'" 
        (click)="cambiarModo('login')">
        Iniciar Sesión
      </button>
      <button 
        type="button" 
        class="tab-btn" 
        [class.active]="modo() === 'registro'" 
        (click)="cambiarModo('registro')">
        Crear Cuenta
      </button>
    </div>

    <h2 class="login-title">
      {{ modo() === 'login' ? 'Iniciar Sesión' : 'Registrarse' }}
    </h2>

    <form (ngSubmit)="onSubmit()">
      @if (modo() === 'registro') {
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input 
            type="text" 
            id="nombre" 
            [(ngModel)]="nombre" 
            name="nombre" 
            placeholder="Tu nombre completo"
            [required]="modo() === 'registro'" 
          />
        </div>
      }

      <div class="form-group">
        <label for="email">Correo:</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="correo@ejemplo.com"
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input 
          [type]="showPassword() ? 'text' : 'password'" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••"
          required 
        />
      </div>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" (change)="toggleShowPassword()" /> Mostrar contraseña
        </label>
      </div>

      @if (errorMessage()) {
        <div class="alert-error">
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Procesando...' : (modo() === 'login' ? 'INGRESAR' : 'REGISTRARSE') }}
      </button>
    </form>
  </div>
</div>
