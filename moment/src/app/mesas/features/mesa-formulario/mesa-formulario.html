<div class="mesas-container">
  <div class="mesa-form-card no-print">
    <h3 class="mesa-form-titulo">
      {{ editandoId() !== null ? 'Modificar Mesa' : 'Nueva Mesa' }}
    </h3>

    <form (submit)="guardar($event)" class="mesa-form">
      <div class="form-campo">
        <label for="numero">Número de Mesa *</label>
        <input
          type="number"
          id="numero"
          [value]="modelo().numero ?? ''"
          (input)="onNumeroInput($event)"
          (blur)="marcarTocado('numero')"
          [class.input-error]="tocados().numero && errorNumero()"
        >
        @if (tocados().numero && errorNumero(); as msgNum) {
          <span class="error-texto">{{ msgNum }}</span>
        }
      </div>

      <div class="form-campo">
        <label for="capacidad">Capacidad *</label>
        <input
          type="number"
          id="capacidad"
          [value]="modelo().capacidad"
          (input)="onCapacidadInput($event)"
          (blur)="marcarTocado('capacidad')"
          [class.input-error]="tocados().capacidad && errorCapacidad()"
        >
        @if (tocados().capacidad && errorCapacidad(); as msgCap) {
          <span class="error-texto">{{ msgCap }}</span>
        }
      </div>

      <div class="form-check-fila">
        <input
          type="checkbox"
          id="activa"
          [checked]="modelo().activa"
          (change)="onActivaChange($event)"
        >
        <label for="activa" class="check-label">Mesa Activa</label>
      </div>

      <div class="form-acciones">
        <button
          type="submit"
          class="btn-primario"
          [disabled]="!formularioValido() || guardando()"
        >
          {{ guardando() ? 'Guardando...' : 'Guardar' }}
        </button>
        <button type="button" class="btn-secundario" (click)="volverALista()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
