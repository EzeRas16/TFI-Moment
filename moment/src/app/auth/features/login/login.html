<div class="login-container">
  <h2>Iniciar Sesión</h2>

  <form (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Correo:</label>
      <input 
        type="email" 
        id="email" 
        [(ngModel)]="email" 
        name="email" 
        required 
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input 
        type="password" 
        id="password" 
        [(ngModel)]="password" 
        name="password" 
        required 
      />
    </div>

    @if (errorMessage()) {
      <div class="alert-error" style="color: red; margin: 10px 0;">
        {{ errorMessage() }}
      </div>
    }

    <button type="submit" [disabled]="isLoading()">
      {{ isLoading() ? 'Cargando...' : 'Ingresar' }}
    </button>
  </form>
</div>
